<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bienvenido a EventosTicket</title>
    <!-- Bootstrap CSS -->
    <link href="../../static/css/bootstrap.css" rel="stylesheet" th:href="@{/css/bootstrap.css}">
    <!-- Custom CSS -->
    <link href="../../static/css/styles.css" rel="stylesheet" th:href="@{/css/styles.css}">
    <link href="../../static/css/singup-styles.css" rel="stylesheet" th:href="@{/css/singup-styles.css}">
</head>
<body>
<header class="text-center py-3">
    <h2>EventosTicket</h2>
</header>
<main>
    <h1>Bienvenido a EventosTicket</h1>
    <div class="container">
        <p>Bienvenido a tu plataforma favorita de eventos, acá podrás comprar tus entradas a los eventos que prefieras. Para empezar, inicia sesión o crea tu cuenta si aún no la tienes!</p>

        <div>
            <a th:href="@{/register}" class="btn">Registrate</a>
        </div>
        <div>
            <a th:href="@{/login}" class="btn">Login</a>
        </div>
    </div>
</main>

<div th:replace="general/utils/footer :: footer"></div>

</body>
</html>
